# Ejecuta el lote (captura y extracción) en GitHub Actions con OIDC. A mano o cada lunes.
name: Pipeline

on:
  workflow_dispatch:
    inputs:
      fase:
        type: choice
        options: [capture-extract, capture, extract, init-db]
        default: capture-extract
  schedule:
    - cron: "0 6 * * 1"

permissions:
  id-token: write
  contents: read

jobs:
  run:
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      FASE: ${{ inputs.fase || 'capture-extract' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e .

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configuración desde las salidas de Terraform
        run: |
          terraform -chdir=infra/main init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"
          o() { terraform -chdir=infra/main output -raw "$1"; }
          {
            echo "KID_BUCKET=$(o bucket)"
            echo "DB_CLUSTER_ARN=$(o db_cluster_arn)"
            echo "DB_SECRET_ARN=$(o db_secret_arn)"
            echo "DB_NAME=$(o db_name)"
            echo "BEDROCK_MODEL_ID=$(o bedrock_model_id)"
          } >> "$GITHUB_ENV"

      - name: Ejecutar
        run: |
          case "$FASE" in
            capture-extract) python scripts/pipeline.py capture && python scripts/pipeline.py extract ;;
            *) python scripts/pipeline.py "$FASE" ;;
          esac
