[project]
name = "kid-pipeline"
version = "0.1.0"
description = "Pipeline de KID de fondos en AWS: captura, S3, Bedrock y PostgreSQL."
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40", "requests>=2.32", "beautifulsoup4>=4.12", "pydantic>=2.8",
    "pypdf>=5.0",          # lectura del PDF al capturarlo (D-1.5)
    "pymupdf4llm>=0.2",    # PDF -> Markdown del KID (D-2.3)
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "mangum>=0.19"]           # imagen de Lambda
dashboard = ["streamlit>=1.40", "pandas>=2.2"]      # imagen de ECS Express
dev = ["kid-pipeline[api,dashboard]", "pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kid_pipeline = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["src"]
pythonpath = ["src"]
markers = ["red: prueba contra las webs reales (pytest -m red)"]
addopts = "-m \"not red\""

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
