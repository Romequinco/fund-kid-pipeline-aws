[project]
name = "kid-pipeline"
version = "0.1.0"
description = "Pipeline de KID de fondos en AWS: captura, S3, Bedrock y PostgreSQL."
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pydantic>=2.8",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "api"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
